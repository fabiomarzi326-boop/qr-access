<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Entrate</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #111827;
            color: white;
        }

        .tr-selected {
            background: #1e3a8a !important;
        }
    </style>
</head>

<body class="p-6">

    <h2 class="text-xl font-bold mb-6">Log entrate</h2>

    <div class="flex gap-4 mb-6">
        <a href="index.html"
           class="bg-gray-700 text-white py-3 px-6 rounded-lg font-bold">
            ⬅️ Torna alla scansione
        </a>

        <button onclick="scaricaExcel()"
                class="bg-green-600 text-white py-3 px-6 rounded-lg font-bold">
            ⬇️ Scarica Excel
        </button>

        <!-- 🔵 INTEGRAZIONE: SVUOTA LOG -->
        <button onclick="svuotaLog()"
                class="bg-red-600 text-white py-3 px-6 rounded-lg font-bold">
            🗑️ Cancella Log
        </button>
    </div>

    <!-- 🔵 INTEGRAZIONE: BARRA AZIONI -->
    <div id="actionBar" class="hidden flex gap-4 mb-6">
        <button onclick="cancellaSelezionata()"
                class="bg-red-600 text-white py-3 px-6 rounded-lg font-bold">
            ❌ Cancella selezionata
        </button>

        <button onclick="ripristinaSelezionata()"
                class="bg-blue-600 text-white py-3 px-6 rounded-lg font-bold">
            ↩️ Ripristina selezionata
        </button>
    </div>

    <table class="min-w-full max-w-3xl mx-auto bg-gray-800 rounded-lg overflow-hidden">
        <thead class="bg-gray-700">
            <tr>
                <th class="px-4 py-3 text-left">Nome</th>
                <th class="px-4 py-3 text-left">Ora</th>
                <th class="px-4 py-3 text-left">Cellulare</th>
                <th class="px-4 py-3 text-left">Stato</th>
            </tr>
        </thead>
        <tbody id="logTable"></tbody>
    </table>

    <script>
        let logEntrate = JSON.parse(localStorage.getItem("logEntrate") || "[]");
        let logCestino = JSON.parse(localStorage.getItem("logCestino") || "[]");
        let selectedId = null;

        /* === CARICA TABELLA === */
        function caricaTabella() {
            const tbody = document.getElementById("logTable");
            tbody.innerHTML = "";

            // ENTRATE ATTIVE
            logEntrate.forEach((r, index) => {
                const id = "attivo-" + index;
                const tr = document.createElement("tr");
                tr.id = id;
                tr.className = "border-b border-gray-700 cursor-pointer";
                tr.onclick = () => selezionaRiga(id, "attivo");

                tr.innerHTML = `
                <td class="px-4 py-3">${r.nome}</td>
                <td class="px-4 py-3">${r.ora}</td>
                <td class="px-4 py-3">${r.cellulare}</td>
                <td class="px-4 py-3 text-green-400">Attivo</td>
            `;

                tbody.appendChild(tr);
            });

            // ENTRATE CANCELLATE
            logCestino.forEach((r, index) => {
                const id = "cestino-" + index;
                const tr = document.createElement("tr");
                tr.id = id;
                tr.className = "border-b border-gray-700 cursor-pointer opacity-50";
                tr.onclick = () => selezionaRiga(id, "cestino");

                tr.innerHTML = `
                <td class="px-4 py-3">${r.nome}</td>
                <td class="px-4 py-3">${r.ora}</td>
                <td class="px-4 py-3">${r.cellulare}</td>
                <td class="px-4 py-3 text-red-400">Cancellato</td>
            `;

                tbody.appendChild(tr);
            });
        }

        /* === SELEZIONA RIGA === */
        function selezionaRiga(id, tipo) {
            selectedId = { id, tipo };

            document.querySelectorAll("tr").forEach(tr => tr.classList.remove("tr-selected"));
            document.getElementById(id).classList.add("tr-selected");

            document.getElementById("actionBar").classList.remove("hidden");
        }

        /* === CANCELLA SELEZIONATA === */
        function cancellaSelezionata() {
            if (!selectedId) return;

            const { id, tipo } = selectedId;

            if (tipo === "attivo") {
                const index = parseInt(id.split("-")[1]);
                const riga = logEntrate.splice(index, 1)[0];
                logCestino.push(riga);
            }

            salva();
            resetSelezione();
        }

        /* === RIPRISTINA SELEZIONATA === */
        function ripristinaSelezionata() {
            if (!selectedId) return;

            const { id, tipo } = selectedId;

            if (tipo === "cestino") {
                const index = parseInt(id.split("-")[1]);
                const riga = logCestino.splice(index, 1)[0];
                logEntrate.push(riga);
            }

            salva();
            resetSelezione();
        }

        /* === SVUOTA LOG === */
        function svuotaLog() {
            if (!confirm("Sicuro di voler cancellare tutto il log?")) return;

            logEntrate = [];
            logCestino = [];
            salva();
            resetSelezione();
        }

        /* === UTILITY === */
        function resetSelezione() {
            selectedId = null;
            document.getElementById("actionBar").classList.add("hidden");
            caricaTabella();
        }

        function salva() {
            localStorage.setItem("logEntrate", JSON.stringify(logEntrate));
            localStorage.setItem("logCestino", JSON.stringify(logCestino));
        }

        /* === SCARICA EXCEL === */
        function scaricaExcel() {
            const ws = XLSX.utils.json_to_sheet(logEntrate);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "LogEntrate");
            XLSX.writeFile(wb, "log_ingressi.xlsx");
        }

        caricaTabella();
    </script>

</body>
</html></html>
