<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Entrate</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#111827; color:white; }
</style>
</head>

<body class="p-6">

<h2 class="text-xl font-bold mb-6">Log entrate</h2>

<div class="flex gap-4 mb-6">
    <a href="index.html"
       class="bg-gray-700 text-white py-3 px-6 rounded-lg font-bold">
       ⬅️ Torna alla scansione
    </a>

    <button onclick="scaricaExcel()"
       class="bg-green-600 text-white py-3 px-6 rounded-lg font-bold">
       ⬇️ Scarica Excel
    </button>
</div>

<table class="min-w-full max-w-3xl mx-auto bg-gray-800 rounded-lg overflow-hidden">
    <thead class="bg-gray-700">
        <tr>
            <th class="px-4 py-3 text-left">Nome</th>
            <th class="px-4 py-3 text-left">Ora</th>
            <th class="px-4 py-3 text-left">Cellulare</th>
        </tr>
    </thead>
    <tbody id="logTable"></tbody>
</table>

<script>
let logEntrate = JSON.parse(localStorage.getItem("logEntrate") || "[]");

function caricaTabella() {
    const tbody = document.getElementById("logTable");
    tbody.innerHTML = "";

    logEntrate.forEach(r => {
        const tr = document.createElement("tr");
        tr.className = "border-b border-gray-700";

        tr.innerHTML = `
            <td class="px-4 py-3">${r.nome}</td>
            <td class="px-4 py-3">${r.ora}</td>
            <td class="px-4 py-3">${r.cellulare}</td>
        `;

        tbody.appendChild(tr);
    });
}

function scaricaExcel() {
    const ws = XLSX.utils.json_to_sheet(logEntrate);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "LogEntrate");
    XLSX.writeFile(wb, "log_ingressi.xlsx");
}

caricaTabella();
</script>

</body>
</html>
