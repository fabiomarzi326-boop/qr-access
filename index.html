<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Access</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js");
        }
    </script>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #f2f2f7;
        }

        #reader {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .overlay-box {
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: white;
            animation: pop 0.25s ease-out;
        }

        @keyframes pop {
            0% {
                transform: scale(0.6);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body class="p-4">

    <!-- SUONO DI CONFERMA -->
    <audio id="beepOk">
        <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=" type="audio/wav">
    </audio>

    <!-- BOTTONE CARICA EXCEL -->
    <div class="w-full flex justify-center mb-6">
        <button id="btnCarica"
                class="bg-blue-600 text-white text-xl font-bold py-4 px-8 rounded-xl shadow-lg active:scale-95 transition">
            📄 CARICA LISTA EXCEL
        </button>
    </div>

    <input type="file" id="excel-input" accept=".xlsx,.xls" class="hidden">

    <!-- CONTATORE INVITATI -->
    <div id="count" class="text-2xl font-bold text-center mb-4"></div>

    <!-- LETTORE QR -->
    <div id="reader"></div>

    <!-- OVERLAY -->
    <div id="overlay">
        <div id="overlay-box" class="overlay-box"></div>
    </div>

    <!-- 🔵 BARRA BOTTONI FINALE -->
    <div class="w-full flex justify-between mt-10 px-4">

        <!-- BTN CHIUDI APP -->
        <button onclick="chiudiApp()"
                class="bg-red-700 text-white text-lg font-bold py-3 px-6 rounded-xl shadow-lg active:scale-95 transition">
            Chiudi App
        </button>

        <!-- BTN LOG -->
        <a href="log.html"
           class="bg-gray-800 text-white text-lg font-bold py-3 px-6 rounded-xl shadow-lg active:scale-95 transition">
            Log Entrate
        </a>

        <!-- BTN WHATSAPP -->
        <button id="btnWA"
                onclick="confermaWhatsApp()"
                disabled
                class="bg-gray-400 text-white text-lg font-bold py-3 px-6 rounded-xl shadow-lg transition">
            Invia Msg
        </button>

    </div>

    <script>
        let guestList = [];
        let logEntrate = JSON.parse(localStorage.getItem("logEntrate") || "[]");
        let html5QrCode;
        let guestSelezionato = null;

        /* 🔵 CARICA LISTA SALVATA SE ESISTE */
        const salvata = localStorage.getItem("guestList");
        if (salvata) {
            guestList = JSON.parse(salvata);

            document.getElementById("count").innerText =
                "INVITATI CARICATI: " + guestList.length;

            // 🔵 DISABILITA BOTTONE CARICA
            const btnCarica = document.getElementById("btnCarica");
            btnCarica.disabled = true;
            btnCarica.classList.add("opacity-40", "cursor-not-allowed");
        }

        /* === CARICA EXCEL === */
        document.getElementById("btnCarica").addEventListener("click", () => {
            document.getElementById("excel-input").click();
        });

        document.getElementById('excel-input').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                const workbook = XLSX.read(evt.target.result, { type: 'binary' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                let raw = XLSX.utils.sheet_to_json(sheet, { header: 1 });

                guestList = raw.slice(1).map(row => ({
                    ID: row[0],
                    Nome: row[1],
                    Cellulare: String(row[2]).replace(/\s+/g, ""),
                    FM: row[3]
                }));

                /* 🔵 SALVA LISTA IN LOCALSTORAGE */
                localStorage.setItem("guestList", JSON.stringify(guestList));

                /* 🔵 DISABILITA BOTTONE CARICA */
                const btnCarica = document.getElementById("btnCarica");
                btnCarica.disabled = true;
                btnCarica.classList.add("opacity-40", "cursor-not-allowed");

                document.getElementById("count").innerText =
                    "INVITATI CARICATI: " + guestList.length;

                showOverlay("LISTA CARICATA<br>" + guestList.length + " INVITATI", "#2563eb");
            };
            reader.readAsBinaryString(file);
        });

        /* === AVVIO CAMERA === */
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            onScanSuccess
        );

        /* === MATCHING SOLO NOME === */
        function onScanSuccess(decodedText) {

            html5QrCode.pause();

            const qrNome = decodedText.trim();

            const guest = guestList.find(g =>
                g.Nome.trim().toLowerCase() === qrNome.toLowerCase()
            );

            if (guest) {
                showOverlay("✔ OK ENTRA<br>" + guest.Nome, "#16a34a");
                document.getElementById("beepOk").play();
                registraIngresso(guest);

                guestSelezionato = guest;
                const btn = document.getElementById("btnWA");
                btn.disabled = false;
                btn.classList.remove("bg-gray-400");
                btn.classList.add("bg-green-600");

            } else {
                showOverlay("✖ NON IN LISTA<br>" + qrNome, "#dc2626");

                guestSelezionato = null;
                const btn = document.getElementById("btnWA");
                btn.disabled = true;
                btn.classList.add("bg-gray-400");
                btn.classList.remove("bg-green-600");
            }

            setTimeout(() => {
                html5QrCode.resume();
            }, 1500);
        }

        /* === REGISTRA INGRESSO === */
        function registraIngresso(guest) {
            const ora = new Date().toLocaleTimeString();
            logEntrate.push({
                nome: guest.Nome,
                ora: ora,
                cellulare: guest.Cellulare
            });
            localStorage.setItem("logEntrate", JSON.stringify(logEntrate));
        }

        /* === WHATSAPP === */
        function sendWhatsApp(guest) {
            const numero = "39" + guest.Cellulare.replace(/\s+/g, "");

            const msg =
                "Ciao " + guest.Nome + ",%0A" +
                "un grazie per la tua partecipazione%0A" +
                "ti auguro di passare una piacevole serata.%0A%0A" +
                "FM: " + guest.FM + "%0A" +
                "Ora ingresso: " + new Date().toLocaleTimeString();

            const url = "https://wa.me/" + numero + "?text=" + msg;
            window.open(url, "_blank");
        }

        /* === CLICK SU WHATSAPP === */
        function confermaWhatsApp() {
            if (!guestSelezionato) return;

            sendWhatsApp(guestSelezionato);

            guestSelezionato = null;
            const btn = document.getElementById("btnWA");
            btn.disabled = true;
            btn.classList.add("bg-gray-400");
            btn.classList.remove("bg-green-600");
        }

        /* === OVERLAY === */
        function showOverlay(text, color) {
            const overlay = document.getElementById("overlay");
            const box = document.getElementById("overlay-box");

            box.innerHTML = text;
            box.style.background = color;

            overlay.style.display = "flex";

            setTimeout(() => {
                overlay.style.display = "none";
            }, 1500);
        }

        /* === CHIUDI APP (iPhone compatibile, elegante, senza logo) === */
        function chiudiApp() {

            const conferma = confirm("Sei sicuro di voler chiudere l’app e cancellare tutto?");
            if (!conferma) return;

            // Cancella lista invitati
            localStorage.removeItem("guestList");

            // Cancella log entrate
            localStorage.removeItem("logEntrate");

            // Cancella cestino log
            localStorage.removeItem("logCestino");

            // Schermata elegante di chiusura
            document.body.innerHTML = `
        <div style="
            width:100vw;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            background: linear-gradient(135deg, #1e3a8a, #000000);
            color:white;
            font-family: sans-serif;
            animation: fadeIn 0.6s ease-out forwards;
        ">
            <div style="font-size:70px; margin-bottom:20px;">✔</div>

            <div style="font-size:28px; font-weight:bold; text-align:center;">
                App chiusa<br>
                Puoi riaprirla dall'icona
            </div>
        </div>

        <style>
            @keyframes fadeIn {
                0% { opacity: 0; }
                100% { opacity: 1; }
            }
        </style>
    `;

            // Dopo 1 secondo → pagina vuota (iPhone)
            setTimeout(() => {
                window.location.href = "about:blank";
            }, 2000);
        }


    </script>

</body>
</html>
